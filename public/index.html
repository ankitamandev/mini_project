<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shortener Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Oswald:wght@500;600&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app" id="app" hidden>
        <header class="topbar">
            <a class="brand" id="brand-logo" href="#overview" aria-label="Overview"></a>
            <nav class="nav" aria-label="Main">
                <a class="pill nav-pill" id="nav-overview" href="#overview" data-view="overview"><span>Overview</span></a>
                <a class="pill nav-pill" id="nav-links" href="#links" data-view="links"><span>Links</span></a>
                <a class="pill nav-pill" id="nav-account" href="#account" data-view="account"><span>Account</span></a>
                <button class="circle" id="search-btn" type="button" aria-label="Find a link" title="Find a link"></button>
            </nav>
            <div class="who">
                <div class="who-text"><strong id="who-email"></strong><span id="who-meta"></span></div>
                <div class="avatar" id="who-avatar" aria-hidden="true"></div>
            </div>
        </header>

        <div class="sample-banner" id="sample-banner" hidden></div>

        <div class="layout">
            <aside class="rail" aria-label="Quick actions">
                <button class="circle" id="rail-refresh" type="button" aria-label="Refresh" title="Refresh"></button>
                <button class="circle" id="rail-signout" type="button" aria-label="Sign out" title="Sign out"></button>
                <button class="circle plus" id="rail-new" type="button" aria-label="New link" title="New link"></button>
            </aside>
            <main id="view" tabindex="-1"></main>
        </div>
    </div>

    <div class="auth" id="auth" hidden></div>

    <button class="fab" id="fab-new" type="button" aria-label="New link" hidden></button>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
